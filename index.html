const emptyPlan = () => ({ anggaranTahunan: 0, sem1: 0, sem2: 0, inputMode: "A", pemasukanRows: [], pengeluaranRows: [] });
/* Menormalkan & memigrasikan data lama (format berbasis kategori tetap)
   ke format baru berbasis Nama Kegiatan, supaya data lama tidak menyebabkan error. */
function normalizePlan(raw) {
  const base = emptyPlan();
  if (!raw || typeof raw !== "object") return base;
  const p = { ...base, ...raw };
  p.pemasukanRows = Array.isArray(raw.pemasukanRows) ? raw.pemasukanRows : [];
  p.pengeluaranRows = Array.isArray(raw.pengeluaranRows) ? raw.pengeluaranRows : [];
  if (p.pemasukanRows.length === 0 && raw.pemasukan && typeof raw.pemasukan === "object") {
    INCOME_SOURCES.forEach(s => { const v = raw.pemasukan[s.key]; if (v) p.pemasukanRows.push({ id: uid(), namaKegiatan: s.label, sumberDana: s.key, anggaranTahunan: v }); });
  }
  if (p.pengeluaranRows.length === 0 && raw.pengeluaran && typeof raw.pengeluaran === "object") {
    CATEGORIES.forEach(c => { const v = raw.pengeluaran[c.key]; if (v) p.pengeluaranRows.push({ id: uid(), namaKegiatan: c.label, kategori: c.key, anggaranTahunan: v }); });
  }
  p.pemasukanRows = p.pemasukanRows.map(r => ({ id: r.id || uid(), namaKegiatan: r.namaKegiatan || "", sumberDana: INCOME_SOURCES.some(s => s.key === r.sumberDana) ? r.sumberDana : INCOME_SOURCES[0].key, anggaranTahunan: Number(r.anggaranTahunan) || 0 }));
  p.pengeluaranRows = p.pengeluaranRows.map(r => ({ id: r.id || uid(), namaKegiatan: r.namaKegiatan || "", kategori: CATEGORIES.some(c => c.key === r.kategori) ? r.kategori : CATEGORIES[0].key, anggaranTahunan: Number(r.anggaranTahunan) || 0 }));
  return p;
}
/* Menormalkan data realisasi lama supaya tidak menyebabkan error. */
function normalizeRealisasi(raw) {
  const base = emptyRealisasi();
  if (!raw || typeof raw !== "object") return base;
  const pemasukan = Array.isArray(raw.pemasukan) ? raw.pemasukan : [];
  const pengeluaran = Array.isArray(raw.pengeluaran) ? raw.pengeluaran : [];
  return {
    pemasukan: pemasukan.map(r => ({ id: r.id || uid(), tanggal: r.tanggal || new Date().toISOString().slice(0,10), namaKegiatan: r.namaKegiatan || "", sumber: INCOME_SOURCES.some(s => s.key === r.sumber) ? r.sumber : INCOME_SOURCES[0].key, nominal: Number(r.nominal) || 0, ceklis: !!r.ceklis, keterangan: r.keterangan || "" })),
    pengeluaran: pengeluaran.map(r => ({ id: r.id || uid(), tanggal: r.tanggal || new Date().toISOString().slice(0,10), namaKegiatan: r.namaKegiatan || "", nama: r.nama || "", kategori: CATEGORIES.some(c => c.key === r.kategori) ? r.kategori : CATEGORIES[0].key, nominalBulanan: Number(r.nominalBulanan) || 0, dari: r.dari || 1, sampai: r.sampai || 1, bulan: Array.isArray(r.bulan) && r.bulan.length === 12 ? r.bulan.map(v => Number(v) || 0) : Array(12).fill(0), ceklis: !!r.ceklis })),
  };
}
const emptyRealisasi = () => ({ pemasukan: [], pengeluaran: [] });

/* ================= util ================= */
function fmtRp(n) {
  const num = Math.round(Number(n) || 0);
  return "Rp. " + num.toLocaleString("id-ID");
}
function toNumber(str) {
  const digits = String(str).replace(/[^\d-]/g, "");
  return digits ? parseInt(digits, 10) : 0;
}
function uid() { return Math.random().toString(36).slice(2, 10); }
function catByLabel(label) {
  if (!label) return null;
  const l = String(label).toLowerCase().trim();
  return CATEGORIES.find(c => c.label.toLowerCase() === l || l.includes(c.label.toLowerCase()) || c.label.toLowerCase().includes(l)) || null;
}
function sourceByLabel(label) {
  if (!label) return null;
  const l = String(label).toLowerCase().trim();
  return INCOME_SOURCES.find(s => s.label.toLowerCase() === l || l.includes(s.label.toLowerCase()) || s.label.toLowerCase().includes(l)) || null;
}
function monthIndexFromDate(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return 0;
  return d.getMonth();
}
function downloadCSV(filename, rows) {
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function academicYear(year) { return `${year}-${parseInt(year, 10) + 1}`; }
function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
  return String(h);
}

/* ================= lapisan penyimpanan ================= */
const hasClaudeStorage = typeof window !== "undefined" && !!window.storage;
const storage = {
  async get(key) {
    if (hasClaudeStorage) return window.storage.get(key, false);
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v, shared: false };
  },
  async set(key, value) {
    if (hasClaudeStorage) return window.storage.set(key, value, false);
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    if (hasClaudeStorage) return window.storage.delete(key, false);
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
};

/* ================= ekspor: cetak / PDF / Excel ================= */
async function exportPDF(elId, filename) {
  const el = document.getElementById(elId);
  if (!el) return;
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff" });
  const imgData = canvas.toDataURL("image/png");
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "p", unit: "mm", format: "a4" });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = (canvas.height * imgWidth) / canvas.width;
  let heightLeft = imgHeight, position = 0;
  pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;
  while (heightLeft > 0) {
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }
  pdf.save(filename);
}
function exportExcelAOA(aoa, filename) {
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Laporan");
  XLSX.writeFile(wb, filename);
}

/* Jaring pengaman: kalau bagian ini gagal ditampilkan, tampilkan pesan
   yang jelas (bukan halaman kosong) dan beri opsi reset data tahun ini. */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Kesalahan tampilan:", error, info); }
  async resetData() {
    try {
      if (this.props.resetKeys) { for (const k of this.props.resetKeys) { await storage.delete(k); } }
    } catch (e) {}
    window.location.reload();
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ maxWidth: 480, margin: "60px auto", padding: 24, textAlign: "center" }}>
          <div style={{ fontSize: 28, marginBottom: 10 }}>⚠️</div>
          <div style={{ fontWeight: 600, marginBottom: 6, fontFamily: "'Source Serif 4', serif" }}>Bagian ini gagal ditampilkan</div>
          <div style={{ fontSize: 12, color: "#6B6355", marginBottom: 6 }}>Kemungkinan data tahun ini rusak atau dari format lama.</div>
          <div style={{ fontSize: 11, color: "#C0392B", background: "#FBEAE6", borderRadius: 8, padding: 10, marginBottom: 16, textAlign: "left", overflowWrap: "break-word" }}>{String((this.state.error && this.state.error.message) || this.state.error)}</div>
          <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
            <button onClick={() => window.location.reload()} style={{ padding: "9px 14px", borderRadius: 7, border: "1px solid #E4DFD3", background: "#fff", fontSize: 13, cursor: "pointer" }}>Muat Ulang</button>
            <button onClick={() => this.resetData()} style={{ padding: "9px 14px", borderRadius: 7, border: "none", background: "#C0392B", color: "#fff", fontSize: 13, cursor: "pointer" }}>Reset Data Tahun Ini</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function RegisterPage({ onGoLogin, onRegistered }) {
  const [nama, setNama] = useState(""); const [username, setUsername] = useState("");
  const [email, setEmail] = useState(""); const [pass, setPass] = useState(""); const [pass2, setPass2] = useState("");
  const [err, setErr] = useState(""); const [ok, setOk] = useState("");
  const submit = async () => {
    setErr(""); setOk("");
    if (!nama.trim() || !username.trim() || !pass || !pass2) { setErr("Semua kolom wajib diisi kecuali email"); return; }
    if (pass !== pass2) { setErr("Kata sandi tidak sama, silakan ketik ulang"); return; }
    let accounts = [];
    try { const r = await storage.get("auth-accounts"); accounts = r ? JSON.parse(r.value) : []; } catch (e) {}
    if (accounts.some(a => a.username.toLowerCase() === username.toLowerCase())) { setErr("Nama pengguna sudah digunakan, pilih yang lain"); return; }
    accounts.push({ username, nama, email, pass: simpleHash(pass) });
    await storage.set("auth-accounts", JSON.stringify(accounts));
    setOk("Pendaftaran berhasil! Silakan masuk menggunakan akun Anda");
    setTimeout(() => onRegistered(username), 900);
  };
  return (
    <AuthShell title="DAFTAR AKUN BARU">
      <TextField label="Nama Lengkap" value={nama} onChange={setNama} />
      <TextField label="Nama Pengguna" value={username} onChange={setUsername} />
      <TextField label="Email" value={email} onChange={setEmail} optional />
      <TextField label="Kata Sandi" type="password" value={pass} onChange={setPass} />
      <TextField label="Ulangi Kata Sandi" type="password" value={pass2} onChange={setPass2} />
      {err && <div style={{ color: "#C0392B", fontSize: 12, marginBottom: 10 }}>⚠️ {err}</div>}
      {ok && <div style={{ color: "#1F6F50", fontSize: 12, marginBottom: 10 }}>✅ {ok}</div>}
      <PrimaryBtn onClick={submit} style={{ width: "100%" }}>Daftar</PrimaryBtn>
      <div style={{ textAlign: "center", fontSize: 12, color: "#6B6355", marginTop: 14 }}>
        Sudah punya akun?{" "}<a href="#" onClick={e => { e.preventDefault(); onGoLogin(); }} style={{ color: "#1F6F50", fontWeight: 500 }}>Masuk di sini</a>
      </div>
    </AuthShell>
  );
}
function LoginPage({ onGoRegister, onLoggedIn }) {
  const [id, setId] = useState(""); const [pass, setPass] = useState(""); const [err, setErr] = useState(""); const [forgot, setForgot] = useState(false);
  const submit = async () => {
    setErr("");
    let accounts = [];
    try { const r = await storage.get("auth-accounts"); accounts = r ? JSON.parse(r.value) : []; } catch (e) {}
    const acc = accounts.find(a => (a.username.toLowerCase() === id.toLowerCase() || (a.email && a.email.toLowerCase() === id.toLowerCase())) && a.pass === simpleHash(pass));
    if (!acc) { setErr("Nama pengguna atau kata sandi tidak sesuai"); return; }
    await storage.set("auth-session", JSON.stringify({ username: acc.username }));

function AccountSettings({ user, onUpdate }) {
  const [nama, setNama] = useState(user.nama); const [email, setEmail] = useState(user.email || "");
  const [pass, setPass] = useState(""); const [pass2, setPass2] = useState(""); const [msg, setMsg] = useState("");
  const save = async () => {
    setMsg("");
    if (pass && pass !== pass2) { setMsg("⚠️ Kata sandi tidak sama, silakan ketik ulang"); return; }
    let accounts = [];
    try { const r = await storage.get("auth-accounts"); accounts = r ? JSON.parse(r.value) : []; } catch (e) {}
    const idx = accounts.findIndex(a => a.username === user.username);
    if (idx >= 0) {
      accounts[idx] = { ...accounts[idx], nama, email, pass: pass ? simpleHash(pass) : accounts[idx].pass };
      await storage.set("auth-accounts", JSON.stringify(accounts));
      onUpdate(accounts[idx]);
      setMsg("✅ Perubahan disimpan"); setPass(""); setPass2("");
    }
  };
  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "40px 20px" }}>
      <div style={{ fontFamily: "'Source Serif 4', serif", fontSize: 20, fontWeight: 600, marginBottom: 18 }}>⚙️ Pengaturan Akun</div>
      <div style={{ background: "#fff", border: "1px solid #E4DFD3", borderRadius: 12, padding: 22 }}>
        <TextField label="Nama Lengkap" value={nama} onChange={setNama} />
        <TextField label="Email" value={email} onChange={setEmail} optional />
        <TextField label="Kata Sandi Baru" type="password" value={pass} onChange={setPass} optional />
        <TextField label="Ulangi Kata Sandi Baru" type="password" value={pass2} onChange={setPass2} optional />
        {msg && <div style={{ fontSize: 12, marginBottom: 10 }}>{msg}</div>}
        <PrimaryBtn onClick={save}>Simpan Perubahan</PrimaryBtn>
      </div>
    </div>
  );
}

function RkasApp({ year }) {
  const [ready, setReady] = useState(false);
  const [plan, setPlan] = useState(emptyPlan());
  const fileInputRef = useRef(null);
  const [uploadTarget, setUploadTarget] = useState(null);
  const [toast, setToast] = useState(null);
  const showToast = (m) => { setToast(m); setTimeout(() => setToast(null), 2600); };

  useEffect(() => {
    if (!year) return;
    setReady(false);
    (async () => {
      try { const p = await storage.get(`rkas-plan:${year}`); setPlan(normalizePlan(p ? JSON.parse(p.value) : null)); }
      catch (e) { setPlan(emptyPlan()); }
      setReady(true);
    })();
  }, [year]);

  const savePlan = useCallback(async (next) => {
    setPlan(next);
    try { await storage.set(`rkas-plan:${year}`, JSON.stringify(next)); }
    catch (e) { showToast("Gagal menyimpan — coba lagi."); }
  }, [year]);

  const totalPemasukanRencana = useMemo(() => plan.pemasukanRows.reduce((s, r) => s + (r.anggaranTahunan || 0), 0), [plan]);
  const totalPengeluaranRencana = useMemo(() => plan.pengeluaranRows.reduce((s, r) => s + (r.anggaranTahunan || 0), 0), [plan]);
  const sisaRencana = totalPemasukanRencana - totalPengeluaranRencana;
  const categoryTotals = useMemo(() => {
    const map = {}; CATEGORIES.forEach(c => map[c.key] = 0);
    plan.pengeluaranRows.forEach(r => { map[r.kategori] = (map[r.kategori] || 0) + (r.anggaranTahunan || 0); });
    return map;
  }, [plan]);

  const setAnggaranMode = (mode) => savePlan({ ...plan, inputMode: mode });
  const setSem = (which, val) => {
    const s1 = which === "sem1" ? val : plan.sem1, s2 = which === "sem2" ? val : plan.sem2;
    savePlan({ ...plan, sem1: s1, sem2: s2, anggaranTahunan: s1 + s2 });
  };
  const setTahunan = (val) => savePlan({ ...plan, anggaranTahunan: val, sem1: Math.round(val / 2), sem2: val - Math.round(val / 2) });

  const addIncomeRow = () => savePlan({ ...plan, pemasukanRows: [...plan.pemasukanRows, { id: uid(), namaKegiatan: "", sumberDana: INCOME_SOURCES[0].key, anggaranTahunan: 0 }] });
  const updateIncomeRow = (id, patch) => savePlan({ ...plan, pemasukanRows: plan.pemasukanRows.map(r => r.id === id ? { ...r, ...patch } : r) });
  const deleteIncomeRow = (id) => savePlan({ ...plan, pemasukanRows: plan.pemasukanRows.filter(r => r.id !== id) });

  const addExpenseRow = () => savePlan({ ...plan, pengeluaranRows: [...plan.pengeluaranRows, { id: uid(), namaKegiatan: "", kategori: CATEGORIES[0].key, anggaranTahunan: 0 }] });
  const updateExpenseRow = (id, patch) => savePlan({ ...plan, pengeluaranRows: plan.pengeluaranRows.map(r => r.id === id ? { ...r, ...patch } : r) });
  const deleteExpenseRow = (id) => savePlan({ ...plan, pengeluaranRows: plan.pengeluaranRows.filter(r => r.id !== id) });

  const parseFile = (file) => new Promise((resolve, reject) => {
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext === "csv") { Papa.parse(file, { header: true, skipEmptyLines: true, complete: (res) => resolve(res.data), error: reject }); }
    else { const reader = new FileReader(); reader.onload = (e) => { try { const wb = XLSX.read(e.target.result, { type: "array" }); resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" })); } catch (err) { reject(err); } }; reader.onerror = reject; reader.readAsArrayBuffer(file); }
  });
  const handleUpload = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const rows = await parseFile(file);
      if (uploadTarget === "pemasukan-plan") {
        const newRows = rows.map(r => { const s = sourceByLabel(r["Sumber Dana"]); return { id: uid(), namaKegiatan: r["Nama Kegiatan"] || "", sumberDana: s ? s.key : INCOME_SOURCES[0].key, anggaranTahunan: toNumber(r["Anggaran Tahunan"]) }; });
        await savePlan({ ...plan, pemasukanRows: [...plan.pemasukanRows, ...newRows] }); showToast("Rencana pemasukan berhasil diunggah.");
      } else if (uploadTarget === "pengeluaran-plan") {
        const newRows = rows.map(r => { const c = catByLabel(r["Kategori"]); return { id: uid(), namaKegiatan: r["Nama Kegiatan"] || "", kategori: c ? c.key : CATEGORIES[0].key, anggaranTahunan: toNumber(r["Anggaran Tahunan"]) }; });
        await savePlan({ ...plan, pengeluaranRows: [...plan.pengeluaranRows, ...newRows] }); showToast("Rencana pengeluaran berhasil diunggah.");
      }

      ["TOTAL PENGELUARAN","","",fmtRp(totalPengeluaranRencana)], [],

          <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse", minWidth: 420 }}>
            <thead><tr style={{ fontSize: 11, color: "#6B6355", textAlign: "left" }}><th style={{padding:"5px 4px"}}>Kategori</th><th style={{padding:"5px 4px", textAlign:"right"}}>Jumlah</th><th style={{padding:"5px 4px", textAlign:"right"}}>% dari Anggaran Tahunan</th></tr></thead>
            <tbody>
              {CATEGORIES.map(c => {
                const pct = plan.anggaranTahunan > 0 ? (categoryTotals[c.key] / plan.anggaranTahunan) * 100 : 0;
                return <tr key={c.key} style={{ borderTop: "1px solid #F0EDE4" }}><td style={{padding:"5px 4px"}}>{c.icon} {c.label}</td><td style={{padding:"5px 4px", textAlign:"right"}}>{fmtRp(categoryTotals[c.key])}</td><td style={{padding:"5px 4px", textAlign:"right"}}>{plan.anggaranTahunan>0?pct.toFixed(1)+"%":"—"}</td></tr>;
              })}
            </tbody>
          </table>
        </div>
        {CATEGORIES.filter(c => c.limitType !== "none").map(c => {
          const pct = plan.anggaranTahunan > 0 ? (categoryTotals[c.key] / plan.anggaranTahunan) * 100 : 0;
          if (c.limitType === "max" && pct > c.limitPct) return <Warning key={c.key} type="warn">{c.label}: melebihi batas maksimal {c.limitPct}%.</Warning>;
          if (c.limitType === "min" && plan.anggaranTahunan > 0 && pct < c.limitPct) return <Warning key={c.key} type="info">{c.label}: minimal harus {c.limitPct}% dari anggaran tahunan.</Warning>;
          return null;
        })}
        <div style={{ marginTop: 12, fontSize: 11, color: "#6B6355" }}>📖 Contoh belanja: {CATEGORIES.map(c => `${c.label} (${c.contoh.split(",").slice(0,3).join(",")})`).join(" · ")}</div>
      </Section>

      <Section icon="📊" title="1.4 Laporan RKAS" subtitle={`Tahun anggaran ${academicYear(year)} — hanya rencana, lengkap dengan cetak & unduh`}>
        <ReportActions onPrint={printRkas} onPdf={pdfRkas} onExcel={excelRkas} />
        <div id="laporan-rkas-print" style={{ background: "#fff" }}>
          <div id="print-area">
          <div style={{ textAlign: "center", marginBottom: 18 }}>
            <div style={{ fontFamily: "'Source Serif 4', serif", fontWeight: 700, fontSize: 18 }}>LAPORAN RKAS</div>
            <div style={{ fontSize: 13, color: "#6B6355" }}>Tahun Anggaran {academicYear(year)}</div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px,1fr))", gap: 12, marginBottom: 16 }}>
            <StatCard label="Rencana Pemasukan" value={totalPemasukanRencana} color="#1F6F50" />
            <StatCard label="Rencana Pengeluaran" value={totalPengeluaranRencana} color="#C0392B" />
            <StatCard label="Sisa Rencana" value={sisaRencana} color="#C08A28" />
          </div>
          {CATEGORIES.filter(c => c.limitType !== "none").map(c => {
            const pct = plan.anggaranTahunan > 0 ? (categoryTotals[c.key] / plan.anggaranTahunan) * 100 : 0;
            if (c.limitType === "max" && pct > c.limitPct) return <Warning key={c.key} type="warn">{c.label}: melebihi batas maksimal {c.limitPct}%.</Warning>;
            if (c.limitType === "min" && plan.anggaranTahunan > 0 && pct < c.limitPct) return <Warning key={c.key} type="info">{c.label}: minimal harus {c.limitPct}% dari anggaran tahunan.</Warning>;
            return null;
          })}
          <div style={{ fontSize: 12, fontWeight: 600, margin: "16px 0 6px" }}>Rincian Pemasukan</div>
          <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse", marginBottom: 14 }}>
            <thead><tr style={{ fontSize: 11, color: "#6B6355", textAlign: "left" }}><th style={{padding:"4px"}}>Nama Kegiatan</th><th style={{padding:"4px"}}>Sumber Dana</th><th style={{padding:"4px", textAlign:"right"}}>Anggaran Tahunan</th></tr></thead>
            <tbody>{plan.pemasukanRows.map(r => <tr key={r.id} style={{ borderTop: "1px solid #F0EDE4" }}><td style={{padding:"4px"}}>{r.namaKegiatan || "—"}</td><td style={{padding:"4px"}}>{(INCOME_SOURCES.find(s=>s.key===r.sumberDana)||{}).label}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(r.anggaranTahunan)}</td></tr>)}</tbody>
          </table>
          <div style={{ fontSize: 12, fontWeight: 600, margin: "10px 0 6px" }}>Rincian Pengeluaran</div>
          <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse", marginBottom: 6 }}>
            <thead><tr style={{ fontSize: 11, color: "#6B6355", textAlign: "left" }}><th style={{padding:"4px"}}>Nama Kegiatan</th><th style={{padding:"4px"}}>Kategori</th><th style={{padding:"4px", textAlign:"right"}}>Anggaran Tahunan</th></tr></thead>
            <tbody>{plan.pengeluaranRows.map(r => <tr key={r.id} style={{ borderTop: "1px solid #F0EDE4" }}><td style={{padding:"4px"}}>{r.namaKegiatan || "—"}</td><td style={{padding:"4px"}}>{(CATEGORIES.find(c=>c.key===r.kategori)||{}).label}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(r.anggaranTahunan)}</td></tr>)}</tbody>
          </table>
          <div style={{ fontSize: 11, color: "#6B6355", margin: "10px 0" }}>Rincian per bulan dibagi rata dari total tahunan.</div>
          <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse" }}>
            <thead><tr style={{ fontSize: 11, color: "#6B6355", textAlign: "left" }}><th style={{padding:"4px"}}>Bulan</th><th style={{padding:"4px", textAlign:"right"}}>Pemasukan</th><th style={{padding:"4px", textAlign:"right"}}>Pengeluaran</th><th style={{padding:"4px", textAlign:"right"}}>Sisa</th></tr></thead>
            <tbody>
              {MONTHS.map(m => <tr key={m} style={{ borderTop: "1px solid #F0EDE4" }}><td style={{padding:"4px"}}>{m}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(monthlyIncome)}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(monthlyExpense)}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(monthlyIncome-monthlyExpense)}</td></tr>)}
              <tr style={{ borderTop: "1px solid #E4DFD3", fontWeight: 600 }}><td style={{padding:"4px"}}>TOTAL TAHUNAN</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(totalPemasukanRencana)}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(totalPengeluaranRencana)}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(sisaRencana)}</td></tr>
            </tbody>
          </table>
          <SignatureBlock year={year} />
          </div>
        </div>
      </Section>
    </div>
  );
}

/* ================= REALISASI TAB ================= */
function RealisasiApp({ year, plan }) {
  const [ready, setReady] = useState(false);
  const [real, setReal] = useState(emptyRealisasi());
  const fileInputRef = useRef(null);
  const [toast, setToast] = useState(null);
  const showToast = (m) => { setToast(m); setTimeout(() => setToast(null), 2600); };

  useEffect(() => {
    if (!year) return;
    setReady(false);
    (async () => { try { const r = await storage.get(`realisasi:${year}`); setReal(normalizeRealisasi(r ? JSON.parse(r.value) : null)); } catch (e) { setReal(emptyRealisasi()); } setReady(true); })();
  }, [year]);

  const saveReal = useCallback(async (next) => {
    setReal(next);
    try { await storage.set(`realisasi:${year}`, JSON.stringify(next)); } catch (e) { showToast("Gagal menyimpan — coba lagi."); }
  }, [year]);

  const addIncomeRow = () => saveReal({ ...real, pemasukan: [...real.pemasukan, { id: uid(), tanggal: new Date().toISOString().slice(0,10), namaKegiatan: "", sumber: INCOME_SOURCES[0].key, nominal: 0, ceklis: false, keterangan: "" }] });
  const updateIncomeRow = (id, patch) => saveReal({ ...real, pemasukan: real.pemasukan.map(r => r.id === id ? { ...r, ...patch } : r) });
  const deleteIncomeRow = (id) => saveReal({ ...real, pemasukan: real.pemasukan.filter(r => r.id !== id) });

  const addExpenseRow = () => saveReal({ ...real, pengeluaran: [...real.pengeluaran, { id: uid(), tanggal: new Date().toISOString().slice(0,10), namaKegiatan: "", nama: "", kategori: CATEGORIES[0].key, nominalBulanan: 0, dari: 1, sampai: 1, bulan: Array(12).fill(0), ceklis: false }] });
  const updateExpenseRow = (id, patch) => saveReal({ ...real, pengeluaran: real.pengeluaran.map(r => r.id === id ? { ...r, ...patch } : r) });
  const deleteExpenseRow = (id) => saveReal({ ...real, pengeluaran: real.pengeluaran.filter(r => r.id !== id) });
  const applyFill = (row) => { const bulan = Array(12).fill(0); for (let m = row.dari; m <= row.sampai; m++) bulan[m - 1] = row.nominalBulanan; updateExpenseRow(row.id, { bulan }); };
  const setMonthCell = (row, idx, val) => { const bulan = [...row.bulan]; bulan[idx] = val; updateExpenseRow(row.id, { bulan }); };

  const incomeMonthly = useMemo(() => { const arr = Array(12).fill(0); real.pemasukan.forEach(r => { arr[monthIndexFromDate(r.tanggal)] += (r.nominal || 0); }); return arr; }, [real]);
  const totalIncomeReal = incomeMonthly.reduce((a,b)=>a+b,0);
  const expenseMonthly = useMemo(() => { const arr = Array(12).fill(0); real.pengeluaran.forEach(r => r.bulan.forEach((v,i) => arr[i] += (v||0))); return arr; }, [real]);
  const totalExpenseReal = expenseMonthly.reduce((a,b)=>a+b,0);
  const expenseByCategory = useMemo(() => { const map = {}; CATEGORIES.forEach(c => map[c.key]=0); real.pengeluaran.forEach(r => { map[r.kategori] = (map[r.kategori]||0) + r.bulan.reduce((a,b)=>a+b,0); }); return map; }, [real]);
  const categoryTotalsPlan = useMemo(() => { const map = {}; CATEGORIES.forEach(c => map[c.key] = 0); (plan.pengeluaranRows||[]).forEach(r => { map[r.kategori] = (map[r.kategori]||0) + (r.anggaranTahunan||0); }); return map; }, [plan]);

  const parseFile = (file) => new Promise((resolve, reject) => {
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext === "csv") { Papa.parse(file, { header: true, skipEmptyLines: true, complete: (res) => resolve(res.data), error: reject }); }
    else { const reader = new FileReader(); reader.onload = (e) => { try { const wb = XLSX.read(e.target.result, { type: "array" }); resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" })); } catch (err) { reject(err); } }; reader.onerror = reject; reader.readAsArrayBuffer(file); }
  });
  const handleUpload = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const rows = await parseFile(file);
      const income = [...real.pemasukan], expense = [...real.pengeluaran];
      rows.forEach(r => {
        const jenis = String(r["Jenis"] || "").toLowerCase();
        const tanggal = r["Tanggal"] || new Date().toISOString().slice(0,10);
        const namaKegiatan = r["Nama Kegiatan"] || "";
        if (jenis.includes("pemasukan")) {
          const s = sourceByLabel(r["Nama/Sumber"]) || sourceByLabel(r["Kategori"]);
          income.push({ id: uid(), tanggal, namaKegiatan, sumber: s ? s.key : INCOME_SOURCES[0].key, nominal: toNumber(r["Nominal"]), ceklis: false, keterangan: r["Nama/Sumber"] || "" });
        } else if (jenis.includes("pengeluaran")) {
          const c = catByLabel(r["Kategori"]); const bulan = Array(12).fill(0); let any = false;
          MONTHS_SHORT.forEach((m,i) => { if (r[m] !== undefined && r[m] !== "") { bulan[i] = toNumber(r[m]); any = true; } });
          if (!any) bulan[monthIndexFromDate(tanggal)] = toNumber(r["Nominal"]);
          expense.push({ id: uid(), tanggal, namaKegiatan, nama: r["Nama/Sumber"] || "", kategori: c ? c.key : CATEGORIES[0].key, nominalBulanan: toNumber(r["Nominal"]), dari: 1, sampai: 12, bulan, ceklis: false });
        }
      });
      await saveReal({ pemasukan: income, pengeluaran: expense });
      showToast("Data realisasi berhasil diunggah.");
    } catch (err) { showToast("Gagal membaca file. Periksa format kolom."); }
    e.target.value = "";
  };
  const downloadTemplate = () => downloadCSV("template_realisasi.csv", [["No","Tanggal","Jenis","Nama Kegiatan","Nama/Sumber","Kategori","Nominal", ...MONTHS_SHORT]]);

  const printReal = () => window.print();
  const pdfReal = () => exportPDF("laporan-realisasi-print", `Laporan_Realisasi_Tahun_Anggaran_${academicYear(year)}.pdf`);
  const excelReal = () => {
    const aoa = [
      [`LAPORAN REALISASI — TAHUN ANGGARAN ${academicYear(year)}`], [],
      ["LAPORAN PER BULAN"], ["Bulan","Pemasukan","Pengeluaran","Saldo"],
      ...MONTHS.map((m,i) => [m, fmtRp(incomeMonthly[i]), fmtRp(expenseMonthly[i]), fmtRp(incomeMonthly[i]-expenseMonthly[i])]),
      ["TOTAL TAHUNAN", fmtRp(totalIncomeReal), fmtRp(totalExpenseReal), fmtRp(totalIncomeReal-totalExpenseReal)], [],
      ["REALISASI PENGELUARAN PER KATEGORI"], ["Kategori","Realisasi","% dari Rencana"],
      ...CATEGORIES.map(c => [c.label, fmtRp(expenseByCategory[c.key]), categoryTotalsPlan[c.key]>0 ? ((expenseByCategory[c.key]/categoryTotalsPlan[c.key])*100).toFixed(1)+"%" : "-"]), [],
      ["DETAIL PEMASUKAN"], ["Tanggal","Nama Kegiatan","Sumber Dana","Nominal","Keterangan"],
      ...real.pemasukan.map(r => [r.tanggal, r.namaKegiatan, (INCOME_SOURCES.find(s=>s.key===r.sumber)||{}).label, fmtRp(r.nominal), r.keterangan]), [],
      ["DETAIL PENGELUARAN"], ["Tanggal","Nama Kegiatan","Nama Belanja","Kategori","Total"],
      ...real.pengeluaran.map(r => [r.tanggal, r.namaKegiatan, r.nama, (CATEGORIES.find(c=>c.key===r.kategori)||{}).label, fmtRp(r.bulan.reduce((a,b)=>a+b,0))]),
    ];
    exportExcelAOA(aoa, `Laporan_Realisasi_Tahun_Anggaran_${academicYear(year)}.xlsx`);
  };

  if (!ready) return <Loading msg="Memuat data realisasi..." />;

  return (
    <div>
      <input type="file" accept=".csv,.xlsx,.xls" ref={fileInputRef} style={{ display: "none" }} onChange={handleUpload} />
      {toast && <div className="no-print" style={{ position: "fixed", bottom: 18, left: "50%", transform: "translateX(-50%)", background: "#1C2B24", color: "#fff", fontSize: 13, padding: "10px 16px", borderRadius: 8, zIndex: 50 }}>{toast}</div>}

      <Section icon="💵" title="2.1 Realisasi Pemasukan" subtitle="Catatan dana yang benar-benar diterima — nama kegiatan wajib diisi">
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 12 }}>
          <SmallBtn onClick={downloadTemplate}>⬇ Contoh File</SmallBtn>
          <SmallBtn onClick={() => fileInputRef.current?.click()}>⬆ Unggah</SmallBtn>
          <SmallBtn onClick={addIncomeRow} style={{ background: "#1F6F50", color: "#fff", border: "none" }}>✚ Tambah</SmallBtn>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse", minWidth: 720 }}>
            <thead><tr style={{ fontSize: 11, color: "#6B6355", textAlign: "left" }}><th style={{padding:"5px 4px"}}>Tanggal</th><th style={{padding:"5px 4px"}}>Nama Kegiatan</th><th style={{padding:"5px 4px"}}>Sumber Dana</th><th style={{padding:"5px 4px", textAlign:"right"}}>Nominal</th><th style={{padding:"5px 4px"}}>Keterangan</th><th style={{padding:"5px 4px", textAlign:"center"}}>✓</th><th></th></tr></thead>
            <tbody>
              {real.pemasukan.length === 0 && <tr><td colSpan={7} style={{ padding: "20px 4px", textAlign: "center", fontSize: 12, color: "#6B6355" }}>Belum ada catatan pemasukan.</td></tr>}
              {real.pemasukan.map(r => (
                <tr key={r.id} style={{ borderTop: "1px solid #F0EDE4" }}>
                  <td style={{padding:"5px 4px"}}><input type="date" value={r.tanggal} onChange={e => updateIncomeRow(r.id, { tanggal: e.target.value })} style={{ padding: "5px 6px", borderRadius: 6, border: "1px solid #E4DFD3", fontSize: 12 }} /></td>
                  <td style={{padding:"5px 4px", minWidth:140}}><NamaKegiatanInput value={r.namaKegiatan} onChange={v => updateIncomeRow(r.id, { namaKegiatan: v })} /></td>
                  <td style={{padding:"5px 4px"}}><select value={r.sumber} onChange={e => updateIncomeRow(r.id, { sumber: e.target.value })} style={{ padding: "5px 6px", borderRadius: 6, border: "1px solid #E4DFD3", fontSize: 12 }}>{INCOME_SOURCES.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}</select></td>
                  <td style={{padding:"5px 4px"}}><MoneyInput value={r.nominal} onChange={v => updateIncomeRow(r.id, { nominal: v })} style={{ width: 130 }} /></td>
                  <td style={{padding:"5px 4px"}}><input value={r.keterangan} onChange={e => updateIncomeRow(r.id, { keterangan: e.target.value })} placeholder="Catatan" style={{ padding: "5px 6px", borderRadius: 6, border: "1px solid #E4DFD3", fontSize: 12, width: "100%" }} /></td>
                  <td style={{padding:"5px 4px", textAlign:"center"}}><button onClick={() => updateIncomeRow(r.id, { ceklis: !r.ceklis })} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 15, color: r.ceklis ? "#1F6F50" : "#C7C1B3" }}>{r.ceklis ? "✓" : "○"}</button></td>
                  <td style={{padding:"5px 4px"}}><button onClick={() => deleteIncomeRow(r.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#C0392B" }}>🗑</button></td>
                </tr>
              ))}
              {real.pemasukan.length > 0 && <tr style={{ borderTop: "1px solid #E4DFD3", fontWeight: 600 }}><td colSpan={3} style={{padding:"5px 4px"}}>TOTAL PEMASUKAN</td><td style={{padding:"5px 4px", textAlign:"right"}}>{fmtRp(totalIncomeReal)}</td><td colSpan={3}></td></tr>}
            </tbody>
          </table>
        </div>
      </Section>

      <Section icon="🧾" title="2.2 Realisasi Pengeluaran" subtitle="Isi otomatis untuk rentang bulan — nama kegiatan wajib diisi">
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>
          <SmallBtn onClick={addExpenseRow} style={{ background: "#1F6F50", color: "#fff", border: "none" }}>✚ Tambah Belanja</SmallBtn>
        </div>
        {real.pengeluaran.length === 0 && <div style={{ padding: "20px 4px", textAlign: "center", fontSize: 12, color: "#6B6355", border: "1px solid #F0EDE4", borderRadius: 8 }}>Belum ada catatan pengeluaran.</div>}
        {real.pengeluaran.map(r => {
          const rowTotal = r.bulan.reduce((a,b)=>a+b,0);
          return (
            <div key={r.id} style={{ border: "1px solid #E4DFD3", borderRadius: 10, padding: 12, marginBottom: 10 }}>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "flex-start", marginBottom: 8 }}>
                <input type="date" value={r.tanggal} onChange={e => updateExpenseRow(r.id, { tanggal: e.target.value })} style={{ padding: "5px 6px", borderRadius: 6, border: "1px solid #E4DFD3", fontSize: 12 }} />
                <div style={{ flex: 1, minWidth: 140 }}><NamaKegiatanInput value={r.namaKegiatan} onChange={v => updateExpenseRow(r.id, { namaKegiatan: v })} /></div>
                <input value={r.nama} onChange={e => updateExpenseRow(r.id, { nama: e.target.value })} placeholder="Nama belanja" style={{ padding: "5px 6px", borderRadius: 6, border: "1px solid #E4DFD3", fontSize: 12, flex: 1, minWidth: 120 }} />
                <select value={r.kategori} onChange={e => updateExpenseRow(r.id, { kategori: e.target.value })} style={{ padding: "5px 6px", borderRadius: 6, border: "1px solid #E4DFD3", fontSize: 12 }}>{CATEGORIES.map(c => <option key={c.key} value={c.key}>{c.icon} {c.label}</option>)}</select>
                <button onClick={() => updateExpenseRow(r.id, { ceklis: !r.ceklis })} title="Ceklis" style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, color: r.ceklis ? "#1F6F50" : "#C7C1B3" }}>{r.ceklis ? "✓" : "○"}</button>
                <button onClick={() => deleteExpenseRow(r.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#C0392B" }}>🗑</button>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "flex-end", marginBottom: 8, fontSize: 12 }}>
                <label>Nominal / bulan<MoneyInput value={r.nominalBulanan} onChange={v => updateExpenseRow(r.id, { nominalBulanan: v })} style={{ width: 130, display: "block", marginTop: 2 }} /></label>
                <label>Dari<select value={r.dari} onChange={e => updateExpenseRow(r.id, { dari: Number(e.target.value) })} style={{ padding: "6px", borderRadius: 6, border: "1px solid #E4DFD3", display: "block", marginTop: 2 }}>{MONTHS.map((m,i)=><option key={m} value={i+1}>{m}</option>)}</select></label>
                <label>Sampai<select value={r.sampai} onChange={e => updateExpenseRow(r.id, { sampai: Number(e.target.value) })} style={{ padding: "6px", borderRadius: 6, border: "1px solid #E4DFD3", display: "block", marginTop: 2 }}>{MONTHS.map((m,i)=><option key={m} value={i+1}>{m}</option>)}</select></label>
                <button onClick={() => applyFill(r)} style={{ padding: "7px 12px", borderRadius: 7, border: "none", background: "#C08A28", color: "#fff", cursor: "pointer" }}>Terapkan ke Bulan</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 4 }}>
                {MONTHS_SHORT.map((m,i) => (<div key={m}><div style={{ fontSize: 10, color: "#6B6355", textAlign: "center", marginBottom: 2 }}>{m}</div><MoneyInput value={r.bulan[i]} onChange={v => setMonthCell(r, i, v)} style={{ width: "100%", padding: "4px", fontSize: 11 }} /></div>))}
              </div>
              <div style={{ textAlign: "right", fontSize: 12, fontWeight: 600, marginTop: 8, color: "#1F6F50" }}>Total baris: {fmtRp(rowTotal)}</div>
            </div>
          );
        })}
      </Section>

      <Section icon="📊" title="2.3 Laporan Realisasi" subtitle={`Tahun anggaran ${academicYear(year)} — data aktual, lengkap dengan cetak & unduh`}>
        <ReportActions onPrint={printReal} onPdf={pdfReal} onExcel={excelReal} />
        <div id="laporan-realisasi-print" style={{ background: "#fff" }}>
          <div id="print-area">
          <div style={{ textAlign: "center", marginBottom: 18 }}>
            <div style={{ fontFamily: "'Source Serif 4', serif", fontWeight: 700, fontSize: 18 }}>LAPORAN REALISASI</div>
            <div style={{ fontSize: 13, color: "#6B6355" }}>Tahun Anggaran {academicYear(year)}</div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px,1fr))", gap: 12, marginBottom: 16 }}>
            <StatCard label="Total Pemasukan" value={totalIncomeReal} color="#1F6F50" />
            <StatCard label="Total Pengeluaran" value={totalExpenseReal} color="#C0392B" />
            <StatCard label="Saldo Akhir" value={totalIncomeReal - totalExpenseReal} color="#C08A28" />
          </div>
          <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse", marginBottom: 16 }}>
            <thead><tr style={{ fontSize: 11, color: "#6B6355", textAlign: "left" }}><th style={{padding:"4px"}}>Bulan</th><th style={{padding:"4px", textAlign:"right"}}>Pemasukan</th><th style={{padding:"4px", textAlign:"right"}}>Pengeluaran</th><th style={{padding:"4px", textAlign:"right"}}>Saldo</th></tr></thead>
            <tbody>
              {MONTHS.map((m,i) => <tr key={m} style={{ borderTop: "1px solid #F0EDE4" }}><td style={{padding:"4px"}}>{m}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(incomeMonthly[i])}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(expenseMonthly[i])}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(incomeMonthly[i]-expenseMonthly[i])}</td></tr>)}
              <tr style={{ borderTop: "1px solid #E4DFD3", fontWeight: 600 }}><td style={{padding:"4px"}}>TOTAL TAHUNAN</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(totalIncomeReal)}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(totalExpenseReal)}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(totalIncomeReal-totalExpenseReal)}</td></tr>
            </tbody>
          </table>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 8 }}>Realisasi Pengeluaran per Kategori</div>
          <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse", marginBottom: 16 }}>
            <thead><tr style={{ fontSize: 11, color: "#6B6355", textAlign: "left" }}><th style={{padding:"4px"}}>Kategori</th><th style={{padding:"4px", textAlign:"right"}}>Realisasi</th><th style={{padding:"4px", textAlign:"right"}}>% dari Rencana</th></tr></thead>
            <tbody>
              {CATEGORIES.map(c => { const pct = categoryTotalsPlan[c.key] > 0 ? (expenseByCategory[c.key] / categoryTotalsPlan[c.key]) * 100 : 0; return <tr key={c.key} style={{ borderTop: "1px solid #F0EDE4" }}><td style={{padding:"4px"}}>{c.icon} {c.label}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(expenseByCategory[c.key])}</td><td style={{padding:"4px", textAlign:"right"}}>{categoryTotalsPlan[c.key]>0?pct.toFixed(1)+"%":"—"}</td></tr>; })}
            </tbody>
          </table>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Rincian Pemasukan</div>
          <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse", marginBottom: 14 }}>
            <thead><tr style={{ fontSize: 11, color: "#6B6355", textAlign: "left" }}><th style={{padding:"4px"}}>Tanggal</th><th style={{padding:"4px"}}>Nama Kegiatan</th><th style={{padding:"4px"}}>Sumber Dana</th><th style={{padding:"4px", textAlign:"right"}}>Nominal</th></tr></thead>
            <tbody>{real.pemasukan.map(r => <tr key={r.id} style={{ borderTop: "1px solid #F0EDE4" }}><td style={{padding:"4px"}}>{r.tanggal}</td><td style={{padding:"4px"}}>{r.namaKegiatan || "—"}</td><td style={{padding:"4px"}}>{(INCOME_SOURCES.find(s=>s.key===r.sumber)||{}).label}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(r.nominal)}</td></tr>)}</tbody>
          </table>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Rincian Pengeluaran</div>
          <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse" }}>
            <thead><tr style={{ fontSize: 11, color: "#6B6355", textAlign: "left" }}><th style={{padding:"4px"}}>Tanggal</th><th style={{padding:"4px"}}>Nama Kegiatan</th><th style={{padding:"4px"}}>Nama Belanja</th><th style={{padding:"4px"}}>Kategori</th><th style={{padding:"4px", textAlign:"right"}}>Total</th></tr></thead>
            <tbody>{real.pengeluaran.map(r => <tr key={r.id} style={{ borderTop: "1px solid #F0EDE4" }}><td style={{padding:"4px"}}>{r.tanggal}</td><td style={{padding:"4px"}}>{r.namaKegiatan || "—"}</td><td style={{padding:"4px"}}>{r.nama}</td><td style={{padding:"4px"}}>{(CATEGORIES.find(c=>c.key===r.kategori)||{}).label}</td><td style={{padding:"4px", textAlign:"right"}}>{fmtRp(r.bulan.reduce((a,b)=>a+b,0))}</td></tr>)}</tbody>
          </table>
          <SignatureBlock year={year} />
          </div>
        </div>
      </Section>
    </div>
  );
}

/* ================= APP UTAMA ================= */
function MainApp({ user, onLogout, onUserUpdate }) {
  const [page, setPage] = useState("home");
  const [years, setYears] = useState([]);
  const [year, setYear] = useState(null);
  const [plan, setPlan] = useState(emptyPlan());
  const [showNewYear, setShowNewYear] = useState(false);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("rkas-years");
        const list = res ? JSON.parse(res.value) : [];
        if (list.length === 0) {
          const y = String(new Date().getFullYear());
          setYears([y]); setYear(y);
          await storage.set("rkas-years", JSON.stringify([y]));
        } else { setYears(list); setYear(list[list.length - 1]); }
      } catch (e) { const y = String(new Date().getFullYear()); setYears([y]); setYear(y); }
      setReady(true);
    })();
  }, []);

  useEffect(() => {
    if (!year) return;
    (async () => { try { const p = await storage.get(`rkas-plan:${year}`); setPlan(normalizePlan(p ? JSON.parse(p.value) : null)); } catch (e) { setPlan(emptyPlan()); } })();
  }, [year, page]);

  const createYear = async (mode) => {
    let y = parseInt(years[years.length - 1] || new Date().getFullYear(), 10) + 1; y = String(y);
    if (years.includes(y)) y = String(parseInt(y) + 1);
    const newList = [...years, y]; setYears(newList);
    await storage.set("rkas-years", JSON.stringify(newList));
    const newPlan = mode === "copy" ? { ...plan } : emptyPlan();
    await storage.set(`rkas-plan:${y}`, JSON.stringify(newPlan));
    await storage.set(`realisasi:${y}`, JSON.stringify(emptyRealisasi()));
    setYear(y); setShowNewYear(false);
  };

  if (!ready) return <Loading msg="Memuat sistem..." />;

  return (
    <div style={{ minHeight: "100vh" }}>
      <TopBar user={user} onLogout={onLogout} onHome={() => setPage("home")} />
      {(page === "rkas" || page === "realisasi") && (
        <div className="no-print" style={{ borderBottom: "1px solid #E4DFD3", background: "#fff" }}>
          <div style={{ maxWidth: 960, margin: "0 auto", padding: "0 20px", display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
            <div style={{ display: "flex", gap: 4 }}>
              <button onClick={() => setPage("rkas")} style={{ padding: "12px 6px", background: "none", border: "none", borderBottom: page === "rkas" ? "2px solid #1F6F50" : "2px solid transparent", color: page === "rkas" ? "#1F6F50" : "#6B6355", fontWeight: 500, fontSize: 13, cursor: "pointer" }}>📑 RKAS</button>
              <button onClick={() => setPage("realisasi")} style={{ padding: "12px 6px", background: "none", border: "none", borderBottom: page === "realisasi" ? "2px solid #1F6F50" : "2px solid transparent", color: page === "realisasi" ? "#1F6F50" : "#6B6355", fontWeight: 500, fontSize: 13, cursor: "pointer" }}>📝 Realisasi</button>
            </div>
            <div style={{ marginLeft: "auto", display: "flex", gap: 8, padding: "10px 0" }}>
              <select value={year || ""} onChange={e => setYear(e.target.value)} style={{ padding: "6px 8px", borderRadius: 6, border: "1px solid #E4DFD3", fontSize: 12 }}>{years.map(y => <option key={y} value={y}>Tahun {y}</option>)}</select>
              <SmallBtn onClick={() => setShowNewYear(true)} style={{ background: "#C08A28", color: "#fff", border: "none" }}>✚ Tahun Baru</SmallBtn>
            </div>
          </div>
        </div>
      )}

      {showNewYear && (
        <div className="no-print" onClick={() => setShowNewYear(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.3)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: 12, padding: 22, maxWidth: 340, width: "100%" }}>
            <div style={{ fontWeight: 600, marginBottom: 4, fontFamily: "'Source Serif 4', serif" }}>Buat Tahun Anggaran Baru</div>
            <div style={{ fontSize: 12, color: "#6B6355", marginBottom: 16 }}>Data tahun {year} akan tetap tersimpan sebagai arsip.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <button onClick={() => createYear("copy")} style={{ padding: "10px 14px", borderRadius: 7, border: "none", background: "#1F6F50", color: "#fff", fontSize: 13, textAlign: "left", cursor: "pointer" }}>Lanjut dari rencana tahun ini</button>
              <button onClick={() => createYear("blank")} style={{ padding: "10px 14px", borderRadius: 7, border: "1px solid #E4DFD3", background: "#fff", fontSize: 13, textAlign: "left", cursor: "pointer" }}>Mulai kosong</button>
            </div>
          </div>
        </div>
      )}

      {page === "home" && <HomeMenu onNavigate={setPage} />}
      {page === "akun" && <AccountSettings user={user} onUpdate={onUserUpdate} />}
      {page === "rkas" && <div style={{ maxWidth: 900, margin: "0 auto", padding: "20px" }}><ErrorBoundary key={`rkas-${year}`} resetKeys={[`rkas-plan:${year}`]}><RkasApp year={year} /></ErrorBoundary></div>}
      {page === "realisasi" && <div style={{ maxWidth: 900, margin: "0 auto", padding: "20px" }}><ErrorBoundary key={`real-${year}`} resetKeys={[`realisasi:${year}`]}><RealisasiApp year={year} plan={plan} /></ErrorBoundary></div>}
    </div>
  );
}

/* ================= ROOT: AUTENTIKASI + SESI ================= */
function Root() {
  const [checking, setChecking] = useState(true);
  const [view, setView] = useState("login");
  const [user, setUser] = useState(null);
  const timerRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const s = await storage.get("auth-session");
        const session = s ? JSON.parse(s.value) : null;
        if (session) {
          const r = await storage.get("auth-accounts");
          const accounts = r ? JSON.parse(r.value) : [];
          const acc = accounts.find(a => a.username === session.username);
          if (acc) setUser(acc);
        }
      } catch (e) {}
      setChecking(false);
    })();
  }, []);

  const logout = useCallback(async () => {
    setUser(null); setView("login");
    try { await storage.delete("auth-session"); } catch (e) {}
  }, []);

  useEffect(() => {
    if (!user) return;
    const reset = () => { clearTimeout(timerRef.current); timerRef.current = setTimeout(logout, INACTIVITY_LIMIT_MS); };
    ["mousemove","keydown","click","touchstart"].forEach(ev => window.addEventListener(ev, reset));
    reset();
    return () => { clearTimeout(timerRef.current); ["mousemove","keydown","click","touchstart"].forEach(ev => window.removeEventListener(ev, reset)); };
  }, [user, logout]);

  if (checking) return <Loading msg="Memuat..." />;
  if (!user) {
    return view === "login"
      ? <LoginPage onGoRegister={() => setView("register")} onLoggedIn={setUser} />
      : <RegisterPage onGoLogin={() => setView("login")} onRegistered={() => setView("login")} />;
  }
  return <MainApp user={user} onLogout={logout} onUserUpdate={setUser} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
